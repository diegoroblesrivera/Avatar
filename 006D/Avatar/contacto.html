<div class="container">
<form>
  <div class="mb-3">
    <label for="nombreUsuario" class="form-label">Nombre</label>
    <input type="text" class="form-control" id="nombreUsuario" value="Ganon" readonly>
  </div>
  <div class="mb-3">
    <label for="direccionUsuario" class="form-label">Direccion</label>
    <input type="text" class="form-control" id="direccionUsuario" >
  </div>
  <div class="mb-3">
    <label for="numeroUsuario" class="form-label">Numero</label>
    <input type="number" class="form-control" id="numeroUsuario" >
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Email address</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" required>
    <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Password</label>
    <input type="password" class="form-control" id="exampleInputPassword1">
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">Check me out</label>
  </div>
  <button type="submit" class="btn btn-success">Enviar</button>
</form>
